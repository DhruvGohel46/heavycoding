# Stage 3: GAN Adversarial Fine-Tuning (ESRGAN Protocol)
# Loads pre-trained Phase 2 generator -> adds PatchGAN Discriminator
# Target: Photorealistic aerial textures (rooftops, roads, vegetation)
# Hardware: RTX A2000 12GB | Expected time: ~50 minutes (20 epochs)

model:
  type: Sen2SR_RGBN
  in_channels: 4
  out_channels: 4
  feat_ch: 64
  num_blocks: 8
  scale: 4

discriminator:
  type: PatchGAN_SN
  in_channels: 4
  base_ch: 64

data:
  dataset: SEN2NAIPv2
  raw_dir: data/raw
  splits_dir: data/splits
  lmdb_dir: data/lmdb_cache
  scale: 4
  patch_size_lr: 96        # HR patch = 384x384 (4x scale)
  norm_factor: 10000.0

training:
  epochs: 20
  batches_per_epoch: 600   # ~50 min total
  batch_size: 4
  grad_accumulation: 2
  amp_fp16: true
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  grad_clip: 1.0

  # Lower LR for fine-tuning (critical: don't reset pre-trained weights)
  optimizer_g:
    type: AdamW
    lr: 0.00005            # 5e-5 - fine-tune rate
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    eps: 1.0e-8

  optimizer_d:
    type: AdamW
    lr: 0.00005            # Matched D/G LR
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    eps: 1.0e-8

  scheduler:
    type: cosine
    min_lr: 5.0e-7
    T_max: 20              # Decay over all 20 epochs

  checkpointing:
    save_dir: checkpoints_sen2sr_gan
    save_every: 5
    auto_resume: true
    init_from: checkpoints_sen2sr_phase2/best_psnr.pth   # Load Phase 2 best

  logging:
    log_every: 30          # Every 30 steps update live_status
    save_visuals_every: 5  # Visual comparison every 5 epochs
    results_dir: results_sen2sr_gan

# Loss weights: Conservative GAN weight preserves Phase 2 gains
loss:
  w_l1: 1.0               # Pixel-level fidelity anchor
  w_sam: 0.25             # Spectral band preservation (non-negotiable)
  w_lap: 0.4              # High-frequency edge sharpness
  w_gan: 0.005            # Adversarial texture push (small but effective)

# Stability monitoring thresholds (abort if exceeded)
monitoring:
  d_loss_min: 0.15        # D shouldn't win too easily (generator collapse)
  d_loss_max: 2.5         # D shouldn't be confused (discriminator collapse)
  sam_max: 4.0            # Spectral angle hard limit (degrees equiv)
  psnr_drop_limit: 2.0    # Max allowed PSNR drop from Phase 2 baseline (35.9 dB)

seed: 42
